[workspace]
resolver = "2"
members = ["crates/typedb-mcp-core", "crates/typedb-mcp", "crates/example-semantic-mcp"]

[workspace.package]
version = "0.1.3"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
rmcp = { version = "1.7", features = [
    "server",
    "client",
    "macros",
    "schemars",
    "transport-io",
    "transport-streamable-http-server",
] }
typedb-driver = "3.11"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml = "0.8"
uuid = { version = "1", features = ["v4"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
futures = "0.3"
tokio-util = "0.7"
