name: release

on:
  push:
    tags: ["v*"]

concurrency:
  group: typedb-mcp-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-apple-darwin
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Validate release tag matches stable workspace version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "${RELEASE_TAG}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          package_version="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "typedb-mcp"))')"
          [[ "${RELEASE_TAG}" == "v${package_version}" ]]

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build binary
        run: cargo build --locked --release --package typedb-mcp --bin typedb-mcp --target "${{ matrix.target }}"

      - name: Package release archive
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          archive="typedb-mcp-${TARGET}.tar.gz"
          binary="target/${TARGET}/release/typedb-mcp"
          test -f "${binary}"
          test -x "${binary}"
          tar -czf "${archive}" -C "$(dirname "${binary}")" typedb-mcp
          test "$(tar -tzf "${archive}" | wc -l)" -eq 1
          test "$(tar -tzf "${archive}")" = typedb-mcp

      - name: Upload target archive
        uses: actions/upload-artifact@v4
        with:
          name: release-asset-${{ matrix.target }}
          path: typedb-mcp-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  create-draft:
    name: Create draft release
    needs: [build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create-release.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: release-asset-*
          merge-multiple: true
          path: release-assets

      - name: Create checksum manifest
        working-directory: release-assets
        run: |
          set -euo pipefail
          sha256sum \
            typedb-mcp-x86_64-unknown-linux-gnu.tar.gz \
            typedb-mcp-aarch64-unknown-linux-gnu.tar.gz \
            typedb-mcp-aarch64-apple-darwin.tar.gz \
            typedb-mcp-x86_64-apple-darwin.tar.gz > SHA256SUMS
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 5

      - name: Create or resume draft and upload assets
        id: create-release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          api="repos/${GITHUB_REPOSITORY}/releases"
          releases="$(gh api "${api}" --paginate --slurp)"
          drafts="$(jq -c "add | [.[] | select(.draft == true)][]" <<<"${releases}")"
          release_json=""
          while IFS= read -r candidate; do
            [[ -n "${candidate}" ]] || continue
            candidate_tag="$(jq -r ".tag_name" <<<"${candidate}")"
            if [[ "${candidate_tag}" == "${RELEASE_TAG}" ]]; then
              if [[ -n "${release_json}" ]]; then
                echo "multiple draft releases already exist for ${RELEASE_TAG}" >&2
                exit 1
              fi
              release_json="${candidate}"
            fi
          done <<<"${drafts}"
          if [[ -z "${release_json}" ]]; then
            release_json="$(gh api "${api}" --method POST \
              -F "tag_name=${RELEASE_TAG}" \
              -F "name=${RELEASE_TAG}" \
              -F draft=true \
              -F generate_release_notes=true)"
          fi
          release_id="$(jq -er ".id | numbers" <<<"${release_json}")"
          upload_url="$(jq -er ".upload_url | strings" <<<"${release_json}")"
          [[ "${release_id}" =~ ^[0-9]+$ ]]
          release_tag="$(jq -r ".tag_name" <<<"${release_json}")"
          release_draft="$(jq -r ".draft" <<<"${release_json}")"
          [[ "${release_tag}" == "${RELEASE_TAG}" ]]
          [[ "${release_draft}" == "true" ]]
          upload_base="${upload_url%%\{*}"
          for asset_name in \
            typedb-mcp-x86_64-unknown-linux-gnu.tar.gz \
            typedb-mcp-aarch64-unknown-linux-gnu.tar.gz \
            typedb-mcp-aarch64-apple-darwin.tar.gz \
            typedb-mcp-x86_64-apple-darwin.tar.gz \
            SHA256SUMS; do
            gh api "${api}/${release_id}/assets" > existing-assets.json
            reuse_existing="$(python3 scripts/check_existing_release_asset.py existing-assets.json "${asset_name}" "release-assets/${asset_name}")"
            if [[ "${reuse_existing}" == "yes" ]]; then
              echo "verified existing asset ${asset_name}; resuming upload"
              continue
            fi
            [[ "${reuse_existing}" == "no" ]]
            curl --fail-with-body --silent --show-error \
              -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@release-assets/${asset_name}" \
              "${upload_base}?name=${asset_name}" > /dev/null
          done
          mkdir -p draft-download
          gh api "${api}/${release_id}" > draft-download/release.json
          python3 scripts/verify_release_assets.py --release-json draft-download/release.json --tag "${RELEASE_TAG}"
          for asset_name in \
            typedb-mcp-x86_64-unknown-linux-gnu.tar.gz \
            typedb-mcp-aarch64-unknown-linux-gnu.tar.gz \
            typedb-mcp-aarch64-apple-darwin.tar.gz \
            typedb-mcp-x86_64-apple-darwin.tar.gz \
            SHA256SUMS; do
            asset_id="$(python3 scripts/release_asset_id.py draft-download/release.json "${asset_name}")"
            [[ "${asset_id}" =~ ^[0-9]+$ ]]
            gh api -H "Accept: application/octet-stream" \
              "${api}/assets/${asset_id}" \
              > "draft-download/${asset_name}"
          done
          python3 scripts/verify_release_assets.py --assets-dir draft-download
          echo "release_id=${release_id}" >> "${GITHUB_OUTPUT}"

  publish-release:
    name: Re-verify and publish release
    needs: [create-draft]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Re-fetch and verify draft immediately before publication
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.create-draft.outputs.release_id }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "${RELEASE_ID}" =~ ^[0-9]+$ ]]
          gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" > release.json
          python3 scripts/verify_release_assets.py --release-json release.json --tag "${RELEASE_TAG}"
          mkdir release-assets
          for asset_name in \
            typedb-mcp-x86_64-unknown-linux-gnu.tar.gz \
            typedb-mcp-aarch64-unknown-linux-gnu.tar.gz \
            typedb-mcp-aarch64-apple-darwin.tar.gz \
            typedb-mcp-x86_64-apple-darwin.tar.gz \
            SHA256SUMS; do
            asset_id="$(python3 scripts/release_asset_id.py release.json "${asset_name}")"
            [[ "${asset_id}" =~ ^[0-9]+$ ]]
            gh api -H "Accept: application/octet-stream" \
              "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" \
              > "release-assets/${asset_name}"
          done
          python3 scripts/verify_release_assets.py --assets-dir release-assets

      - name: Publish re-verified draft release by ID
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.create-draft.outputs.release_id }}
        run: |
          set -euo pipefail
          [[ "${RELEASE_ID}" =~ ^[0-9]+$ ]]
          gh api --method PATCH -F draft=false \
            "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" >/dev/null

  verify-published:
    name: Verify published release assets
    needs: [publish-release]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Download published assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir release-assets
          gh release download "${RELEASE_TAG}" --dir release-assets

      - name: Verify public archive bytes and checksum manifest
        run: python3 scripts/verify_release_assets.py --assets-dir release-assets

  verify-release-metadata:
    name: Verify published release metadata
    needs: [publish-release]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Fetch public release metadata
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" > release.json

      - name: Verify stable published release metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          python3 scripts/verify_release_assets.py
          --release-json release.json
          --tag "${RELEASE_TAG}"
          --expect-published
