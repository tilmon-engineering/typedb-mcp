name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-apple-darwin
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Validate release tag matches stable workspace version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "${RELEASE_TAG}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          package_version="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "typedb-mcp"))')"
          [[ "${RELEASE_TAG}" == "v${package_version}" ]]

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build binary
        run: cargo build --locked --release --package typedb-mcp --bin typedb-mcp --target "${{ matrix.target }}"

      - name: Package release archive
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          archive="typedb-mcp-${TARGET}.tar.gz"
          binary="target/${TARGET}/release/typedb-mcp"
          test -f "${binary}"
          test -x "${binary}"
          tar -czf "${archive}" -C "$(dirname "${binary}")" typedb-mcp
          test "$(tar -tzf "${archive}" | wc -l)" -eq 1
          test "$(tar -tzf "${archive}")" = typedb-mcp

      - name: Upload target archive
        uses: actions/upload-artifact@v4
        with:
          name: release-asset-${{ matrix.target }}
          path: typedb-mcp-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  create-draft:
    name: Create draft release
    needs: [build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: release-asset-*
          merge-multiple: true
          path: release-assets

      - name: Create checksum manifest
        working-directory: release-assets
        run: |
          set -euo pipefail
          sha256sum \
            typedb-mcp-x86_64-unknown-linux-gnu.tar.gz \
            typedb-mcp-aarch64-unknown-linux-gnu.tar.gz \
            typedb-mcp-aarch64-apple-darwin.tar.gz \
            typedb-mcp-x86_64-apple-darwin.tar.gz > SHA256SUMS
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 5

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "${RELEASE_TAG}" \
            --draft \
            --verify-tag \
            --title "${RELEASE_TAG}" \
            --generate-notes \
            release-assets/typedb-mcp-x86_64-unknown-linux-gnu.tar.gz \
            release-assets/typedb-mcp-aarch64-unknown-linux-gnu.tar.gz \
            release-assets/typedb-mcp-aarch64-apple-darwin.tar.gz \
            release-assets/typedb-mcp-x86_64-apple-darwin.tar.gz \
            release-assets/SHA256SUMS

  verify-draft:
    name: Verify draft release assets
    needs: [create-draft]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Download draft assets and metadata
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir release-assets
          gh release download "${RELEASE_TAG}" --dir release-assets
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" > release.json

      - name: Verify draft assets and metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          python3 scripts/verify_release_assets.py
          --assets-dir release-assets
          --release-json release.json
          --tag "${RELEASE_TAG}"

  publish-release:
    name: Publish verified release
    needs: [verify-draft]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release edit "${RELEASE_TAG}" --draft=false

  verify-published:
    name: Verify published release assets
    needs: [publish-release]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Download published assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir release-assets
          gh release download "${RELEASE_TAG}" --dir release-assets

      - name: Verify public archive bytes and checksum manifest
        run: python3 scripts/verify_release_assets.py --assets-dir release-assets

  verify-release-metadata:
    name: Verify published release metadata
    needs: [publish-release]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Fetch public release metadata
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" > release.json

      - name: Verify stable published release metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          python3 scripts/verify_release_assets.py
          --release-json release.json
          --tag "${RELEASE_TAG}"
          --expect-published
